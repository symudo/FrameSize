name: CI & Cloud Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Generate icons & build packages
        run: |
          npm run icons
          npm run package

      - name: Upload Chromium & Firefox packages
        uses: actions/upload-artifact@v4
        with:
          name: framesize-extension-packages
          path: release/*.zip
          if-no-files-found: error
