name: CI & Cloud Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run TypeScript unit tests
        run: npm test

      - name: Run Go helper unit tests
        working-directory: native-helper
        run: go test -v ./...

      - name: Generate icons & package Chromium, Firefox, and Windows Helper
        run: |
          npm run icons
          npm run package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: framesize-packages
          path: release/*.zip
          if-no-files-found: error
